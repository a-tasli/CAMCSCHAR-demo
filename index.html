<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Eye Tracking Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <div id="status-display">Ready. Click Start to calibrate.</div>
        
        <!-- NEW: Calibration Overlay -->
        <div id="calibration-overlay">
            <h2 id="calibration-instruction">Look at each red dot and click it.</h2>
        </div>
        
        <div id="gaze-dot"></div>

        <!-- NEW: Context-Aware Presentation Panel -->
        <div id="presentation-ui" class="presentation-panel strain-low" style="display: none;">
            <h2>Waiting for data...</h2>
            <p>Please complete calibration to begin content adaptation.</p>
        </div>

        <div class="controls">
            <button id="connect-hr-btn" style="background-color: #ff4757; border: none; color: white;">Connect HR Monitor</button>
            <button id="start-btn">Start Tracking</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
    </div>

    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
